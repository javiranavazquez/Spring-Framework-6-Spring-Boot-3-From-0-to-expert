<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Document</title>
</head>

<body>
    <h1 th:text="${title}"></h1>
    <div th:if="${userlist.isEmpty()}" th:text="'No tiene elementos'"></div>

    <table th:if="${not userlist.isEmpty()}">
        <thead>
            <tr>
                <th>nombre</th>
                <th>apellido</th>
                <th>email</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user: ${userlist}">
                <td th:text="${user.name}"></td>
                <td th:text="${user.lastname}"></td>
                <td th:if="${user.email}" th:text="${user.email}"></td>
                <td th:if="${not(user.email != null)}" th:text="'-'"></td>
            </tr>
        </tbody>
    </table>
</body>

</html>
